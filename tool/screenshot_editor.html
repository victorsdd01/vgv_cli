<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>vgv screenshots — editor</title>
<style>
  :root {
    --bg: #0e0f13; --panel: #16181e; --panel2: #1d2027; --line: #262a33;
    --text: #e8ebf0; --muted: #949bab; --accent: #39d6e0;
    --stage1: #15171d; --stage2: #0e0f13;
  }
  :root[data-theme="light"] {
    --bg: #f4f6fa; --panel: #ffffff; --panel2: #eef1f6; --line: #d9dee7;
    --text: #1a1d24; --muted: #667085; --accent: #0aa2ad;
    --stage1: #eef1f6; --stage2: #f4f6fa;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  #app { display: grid; grid-template-columns: 320px 1fr; height: 100vh; }
  #sidebar { background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; padding: 16px; }
  #stage { display: flex; align-items: center; justify-content: center; overflow: auto; padding: 24px;
    background: radial-gradient(1200px 600px at 50% 0%, var(--stage1), var(--stage2)); }
  .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .iconbtn { width: 30px; height: 30px; display: grid; place-items: center; background: var(--panel2);
    border: 1px solid var(--line); border-radius: 8px; cursor: pointer; font-size: 14px; line-height: 1;
    transition: border-color .15s; }
  .iconbtn:hover { border-color: var(--accent); }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg .lang { border: 0; background: transparent; color: var(--muted); padding: 5px 11px;
    cursor: pointer; font: inherit; font-size: 12px; font-weight: 600; letter-spacing: .3px; }
  .seg .lang.active { background: var(--accent); color: #05222a; }
  h1 { font-size: 15px; margin: 0 0 4px; letter-spacing: .2px; }
  .sub { color: var(--muted); font-size: 12px; margin: 0 0 16px; }
  .group { margin-bottom: 18px; }
  .group > label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .6px;
    color: var(--muted); margin-bottom: 6px; }
  input[type=text], textarea, select {
    width: 100%; background: var(--panel2); color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 10px; font: inherit; outline: none; }
  input[type=text]:focus, textarea:focus, select:focus { border-color: var(--accent); }
  textarea { resize: vertical; min-height: 52px; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { padding: 6px 10px; border-radius: 999px; border: 1px solid var(--line);
    background: var(--panel2); cursor: pointer; font-size: 12px; user-select: none; }
  .chip.active { border-color: var(--accent); color: var(--accent); }
  .swatches { display: flex; flex-wrap: wrap; gap: 6px; }
  .sw { width: 26px; height: 26px; border-radius: 6px; cursor: pointer; border: 2px solid transparent; }
  .sw.active { border-color: #fff; }
  input[type=color] { width: 100%; height: 34px; background: var(--panel2); border: 1px solid var(--line);
    border-radius: 8px; padding: 2px; }
  button.file, .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    width: 100%; background: var(--panel2); color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 9px 10px; cursor: pointer; font: inherit; }
  .btn.primary { background: var(--accent); color: #05222a; border-color: var(--accent); font-weight: 700; }
  .btn.primary:hover { filter: brightness(1.05); }
  .hint { color: var(--muted); font-size: 11px; margin-top: 6px; }
  canvas#c { max-width: 100%; max-height: calc(100vh - 48px); border-radius: 18px;
    box-shadow: 0 30px 80px rgba(0,0,0,.5); cursor: grab; }
  canvas#c:active { cursor: grabbing; }
  .toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    background: var(--panel2); color: var(--text); border: 1px solid var(--line);
    padding: 10px 16px; border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.25);
    opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
  .divider { height: 1px; background: var(--line); margin: 14px 0; }
  .thumbs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .thumb { aspect-ratio: 9/16; background: var(--panel2); border: 1px solid var(--line); border-radius: 6px;
    overflow: hidden; cursor: pointer; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .thumb.active { border-color: var(--accent); }
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="topbar">
      <button class="iconbtn" id="themeToggle" title="Theme">🌙</button>
      <div class="seg">
        <button class="lang" data-lang="en">EN</button>
        <button class="lang" data-lang="es">ES</button>
      </div>
    </div>
    <h1>vgv screenshots</h1>
    <p class="sub" data-i18n="tagline">Frame your app screenshots — no Python needed.</p>

    <div class="group">
      <label data-i18n="template">Template</label>
      <div class="chips" id="templates"></div>
    </div>

    <div class="group">
      <label data-i18n="device">Device</label>
      <div class="chips" id="devices"></div>
    </div>

    <div class="group">
      <label data-i18n="output_size">Output size</label>
      <select id="sizeSel"></select>
      <div class="row" id="customSize" style="display:none; margin-top:8px">
        <input type="text" id="sizeW" placeholder="width" />
        <input type="text" id="sizeH" placeholder="height" />
      </div>
    </div>

    <div class="group">
      <label data-i18n="device_frame">Device frame</label>
      <div class="chips" id="frameModes"></div>
      <div class="thumbs" id="frameThumbs" style="margin-top:8px; display:none"></div>
      <button class="file" id="pickFrame" style="margin-top:8px; display:none" data-i18n="load_frame">Load frame PNG…</button>
      <div class="hint" id="frameHint">“Image” lets you drop a real device frame (transparent screen) — e.g. Apple Product Bezels or Google Device Art. Pass <code>--frames &lt;dir&gt;</code> to list your own.</div>
    </div>

    <div class="group">
      <label data-i18n="screenshot">Screenshot</label>
      <button class="file" id="pickShot" data-i18n="upload">Upload screenshot…</button>
      <button class="file" id="pickShot2" style="margin-top:8px; display:none" data-i18n="second_shot">Second screenshot (duo)…</button>
      <div class="thumbs" id="rawThumbs" style="margin-top:8px"></div>
      <div class="hint" id="rawHint"></div>
    </div>

    <div class="group">
      <label><span data-i18n="headline">Headline</span> <span class="hint" data-i18n="headline_hint">(**word** = accent)</span></label>
      <textarea id="headline">Catch **stick drift** in real time</textarea>
    </div>
    <div class="group">
      <label data-i18n="subtitle">Subtitle</label>
      <textarea id="subtitle">Live per-stick offset and max deflection.</textarea>
    </div>

    <div class="group">
      <label data-i18n="text_layout">Text — position, align, size</label>
      <div class="chips" id="textPos"></div>
      <div class="chips" id="textAlign" style="margin-top:6px"></div>
      <input type="range" id="textSize" min="0.6" max="1.6" step="0.05" value="1" style="width:100%; margin-top:10px" />
      <div class="hint" data-i18n="text_tip">Tip: drag the text on the canvas, or double-click it to edit.</div>
    </div>

    <div class="group">
      <label data-i18n="accent">Accent</label>
      <input type="color" id="accent" value="#39d6e0" />
    </div>

    <div class="group">
      <label data-i18n="background">Background</label>
      <div class="chips" id="presets"></div>
      <div class="row" style="margin-top:8px">
        <input type="color" id="bg" value="#0e0f11" />
        <button class="file" id="pickBg" data-i18n="image_btn">Image…</button>
      </div>
      <button class="btn" id="clearBg" style="margin-top:8px" data-i18n="use_gradient">Use gradient</button>
    </div>

    <div class="divider"></div>
    <div class="group">
      <button class="btn" id="download" data-i18n="download">Download PNG</button>
      <button class="btn primary" id="save" style="margin-top:8px" data-i18n="save">Save to project (out/)</button>
      <div class="hint" id="saveHint"></div>
    </div>
  </aside>

  <main id="stage">
    <canvas id="c"></canvas>
  </main>
</div>
<div class="toast" id="toast"></div>

<script>
"use strict";
const DEVICES = {
  iphone:  { label: "iPhone",  w: 1290, h: 2796, notch: "island" },
  android: { label: "Android", w: 1080, h: 1920, notch: "punch" },
  ipad:    { label: "iPad",    w: 2048, h: 2732, notch: null },
};
const TEMPLATES = ["poster", "tilted", "showcase", "duo", "hero", "frame", "feature_graphic"];
// Store-exact output sizes (label -> [w,h]); null = device default.
const SIZES = [
  ["Device default", null],
  ["iPhone 6.7/6.9\" · 1290×2796", [1290,2796]],
  ["iPhone 6.9\" · 1260×2736", [1260,2736]],
  ["iPhone 6.9\" · 1320×2868", [1320,2868]],
  ["iPad 12.9\" · 2048×2732", [2048,2732]],
  ["iPad 13\" · 2064×2752", [2064,2752]],
  ["Android · 1080×1920", [1080,1920]],
  ["Custom…", "custom"],
];
const PRESETS = {
  ocean:  { accent: "#39d6e0", bg: "#0b1f2a" },
  sunset: { accent: "#ff7a59", bg: "#241019" },
  grape:  { accent: "#7c4dff", bg: "#141018" },
  forest: { accent: "#43a047", bg: "#0e1a12" },
  mono:   { accent: "#c7cdd4", bg: "#101215" },
  gold:   { accent: "#e0b341", bg: "#20180a" },
};

const state = {
  device: "iphone",
  template: "poster",
  headline: "Catch **stick drift** in real time",
  subtitle: "Live per-stick offset and max deflection.",
  accent: "#39d6e0",
  bg: "#0e0f11",
  bgImage: null,     // HTMLImageElement or null
  shot: null,        // HTMLImageElement or null
  shot2: null,       // second screenshot (duo template)
  sizeOverride: null,// [w,h] to force an exact store size, or null
  dragX: 0, dragY: 0,
  textPos: "top",    // top | center | bottom
  textAlign: "center",
  textSize: 1,       // font-size multiplier
  textDX: 0, textDY: 0,
  frameMode: "code", // "code" (drawn) | "real" (image)
  frameImg: null,    // HTMLImageElement of a device frame (transparent screen)
  frameScreen: null, // [x0,y0,x1,y1] fractions of the screen hole within the frame
};

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

// i18n data + state (declared early so populateSizes()/t() are safe to call).
const I18N = {
  en: {
    tagline: "Frame your app screenshots — no Python needed.",
    template: "Template", device: "Device", output_size: "Output size",
    device_frame: "Device frame", screenshot: "Screenshot", subtitle: "Subtitle",
    accent: "Accent", background: "Background", headline: "Headline",
    headline_hint: "(**word** = accent)",
    text_layout: "Text — position, align, size", text_tip: "Tip: drag the text on the canvas, or double-click it to edit.",
    pos_top: "Top", pos_center: "Center", pos_bottom: "Bottom",
    al_left: "Left", al_center: "Center", al_right: "Right",
    upload: "Upload screenshot…", second_shot: "Second screenshot (duo)…",
    load_frame: "Load frame PNG…", image_btn: "Image…", use_gradient: "Use gradient",
    download: "Download PNG", save: "Save to project (out/)",
    size_default: "Device default", size_custom: "Custom…",
    raw_hint: "Tip: pass --raw <dir> to pick from your screenshots.",
    frame_hint_default: "“Image” lets you drop a real device frame (transparent screen) — e.g. Apple Product Bezels or Google Device Art. Pass --frames <dir> to list your own.",
    frame_hint_ok: "Frame loaded — screen detected. Your screenshot composites inside it.",
    frame_hint_none: "Loaded, but no transparent screen detected. Use a frame PNG with a see-through screen.",
    saved: "Saved → ", save_fail: "Save failed",
  },
  es: {
    tagline: "Enmarcá las capturas de tu app — sin Python.",
    template: "Plantilla", device: "Dispositivo", output_size: "Tamaño de salida",
    device_frame: "Marco del dispositivo", screenshot: "Captura", subtitle: "Subtítulo",
    accent: "Acento", background: "Fondo", headline: "Título",
    headline_hint: "(**palabra** = acento)",
    text_layout: "Texto — posición, alineación, tamaño", text_tip: "Tip: arrastrá el texto en el canvas, o doble-click para editarlo.",
    pos_top: "Arriba", pos_center: "Centro", pos_bottom: "Abajo",
    al_left: "Izq.", al_center: "Centro", al_right: "Der.",
    upload: "Subir captura…", second_shot: "Segunda captura (duo)…",
    load_frame: "Cargar frame PNG…", image_btn: "Imagen…", use_gradient: "Usar gradiente",
    download: "Descargar PNG", save: "Guardar en el proyecto (out/)",
    size_default: "Tamaño del dispositivo", size_custom: "Personalizado…",
    raw_hint: "Tip: pasá --raw <dir> para elegir de tus capturas.",
    frame_hint_default: "“Imagen” te deja soltar un marco real (pantalla transparente) — p.ej. Apple Product Bezels o Google Device Art. Pasá --frames <dir> para listar los tuyos.",
    frame_hint_ok: "Marco cargado — pantalla detectada. Tu captura se compone adentro.",
    frame_hint_none: "Cargado, pero no se detectó pantalla transparente. Usá un frame PNG con la pantalla calada.",
    saved: "Guardado → ", save_fail: "No se pudo guardar",
  },
};
let lang = localStorage.getItem('vgvLang') || (navigator.language || 'en').slice(0,2);
if (!I18N[lang]) lang = 'en';
let frameHintKey = 'frame_hint_default';
let rawHintKey = null;
function t(k){ return (I18N[lang] && I18N[lang][k]) || I18N.en[k] || k; }

// ---------- helpers ----------
function hexToRgb(h) { h = h.replace('#',''); return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)]; }
function mix(a, b, t) { return a.map((v,i)=>Math.round(v+(b[i]-v)*t)); }
function rgb(c){ return `rgb(${c[0]},${c[1]},${c[2]})`; }
function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function drawCover(img,x,y,w,h){ const ir=img.width/img.height, tr=w/h; let sw,sh,sx,sy;
  if(ir>tr){ sh=img.height; sw=sh*tr; sx=(img.width-sw)/2; sy=0; } else { sw=img.width; sh=sw/tr; sx=0; sy=(img.height-sh)/2; }
  ctx.drawImage(img, sx,sy,sw,sh, x,y,w,h); }

// Detect the transparent "screen" hole inside a device frame image: flood-fill
// transparency from the borders (that's the outer margin); the transparent
// pixels NOT reached are the enclosed screen. Returns [x0,y0,x1,y1] fractions
// or null if the frame has no see-through screen.
function detectFrameScreen(img){
  const MAX=320; const s=Math.min(1, MAX/Math.max(img.width,img.height));
  const w=Math.max(1,Math.round(img.width*s)), h=Math.max(1,Math.round(img.height*s));
  const oc=document.createElement('canvas'); oc.width=w; oc.height=h;
  const octx=oc.getContext('2d'); octx.drawImage(img,0,0,w,h);
  const data=octx.getImageData(0,0,w,h).data;
  const A=i=>data[i*4+3];
  const outer=new Uint8Array(w*h); const st=[];
  const push=(x,y)=>{ const i=y*w+x; if(!outer[i] && A(i)<=10){ outer[i]=1; st.push(i); } };
  for(let x=0;x<w;x++){ push(x,0); push(x,h-1); }
  for(let y=0;y<h;y++){ push(0,y); push(w-1,y); }
  while(st.length){ const i=st.pop(); const x=i%w, y=(i/w)|0;
    if(x+1<w) push(x+1,y); if(x-1>=0) push(x-1,y); if(y+1<h) push(x,y+1); if(y-1>=0) push(x,y-1); }
  let minx=1e9,miny=1e9,maxx=-1,maxy=-1,cnt=0;
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){ const i=y*w+x; if(A(i)<=10 && !outer[i]){ cnt++;
    if(x<minx)minx=x; if(y<miny)miny=y; if(x>maxx)maxx=x; if(y>maxy)maxy=y; } }
  if(cnt < (w*h*0.01)) return null; // no meaningful enclosed hole
  return [minx/w, miny/h, (maxx+1)/w, (maxy+1)/h];
}

function background(W,H,accent,bgHex,bgImg,glowY){
  if (bgImg){ drawCover(bgImg,0,0,W,H); const g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'rgba(6,8,12,.55)'); g.addColorStop(1,'rgba(2,3,5,.8)'); ctx.fillStyle=g; ctx.fillRect(0,0,W,H); return; }
  const bg=hexToRgb(bgHex), top=mix(bg,[255,255,255],0.06), bot=mix(bg,[0,0,0],0.35);
  const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,rgb(top)); g.addColorStop(1,rgb(bot));
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  const ac=hexToRgb(accent); const rg=ctx.createRadialGradient(W/2,glowY,0,W/2,glowY,W*0.8);
  rg.addColorStop(0,`rgba(${ac[0]},${ac[1]},${ac[2]},.34)`); rg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=rg; ctx.fillRect(0,0,W,H);
}

function drawPhone(x,y,w,h,notch,shot){
  const r=w*0.16;
  ctx.save(); ctx.shadowColor='rgba(0,0,0,.5)'; ctx.shadowBlur=w*0.08; ctx.shadowOffsetY=w*0.03;
  roundRect(x,y,w,h,r); ctx.fillStyle='#0b0d10'; ctx.fill(); ctx.restore();
  roundRect(x,y,w,h,r); ctx.lineWidth=Math.max(2,w*0.006); ctx.strokeStyle='rgba(255,255,255,.10)'; ctx.stroke();
  const bz=w*0.032, sx=x+bz, sy=y+bz, sw=w-2*bz, sh=h-2*bz, sr=r-bz*0.5;
  ctx.save(); roundRect(sx,sy,sw,sh,sr); ctx.clip();
  if(shot){ drawCover(shot,sx,sy,sw,sh); } else { ctx.fillStyle='#12151b'; ctx.fillRect(sx,sy,sw,sh);
    ctx.fillStyle='#3a414d'; ctx.font=`${Math.round(sw*0.06)}px sans-serif`; ctx.textAlign='center';
    ctx.fillText('your screenshot', sx+sw/2, sy+sh/2); }
  ctx.restore();
  if(notch==='island'){ const iw=sw*0.32, ih=w*0.055; roundRect(x+w/2-iw/2, sy+ih*0.55, iw, ih, ih/2); ctx.fillStyle='#000'; ctx.fill(); }
  else if(notch==='punch'){ ctx.beginPath(); ctx.arc(x+w/2, sy+w*0.05, w*0.017, 0, Math.PI*2); ctx.fillStyle='#000'; ctx.fill(); }
}

let textBox=null; // last drawn text block {x,y,w,h} for hit-testing drag/edit
function tokens(text){ const out=[]; let acc=false; for(const chunk of text.split('**')){ for(const w of chunk.split(' ')){ if(w) out.push([w,acc]); } acc=!acc; } return out; }

// Unified, movable text block (used by poster/tilted/showcase/duo).
function _wrapHeadline(text, maxW, size){
  ctx.font=`700 ${size}px -apple-system, "Segoe UI", Roboto, sans-serif`;
  const spaceW=ctx.measureText(' ').width; const toks=tokens(text); const lines=[]; let cur=[], curW=0;
  for(const [w,isAcc] of toks){ const ww=ctx.measureText(w).width; if(cur.length && curW+spaceW+ww>maxW){ lines.push(cur); cur=[]; curW=0; } cur.push([w,isAcc,ww]); curW+=(cur.length>1?spaceW:0)+ww; }
  if(cur.length) lines.push(cur); return {lines, spaceW};
}
function _wrapSub(text, maxW, size){
  ctx.font=`400 ${size}px -apple-system, "Segoe UI", Roboto, sans-serif`;
  const words=text.split(' '); const lines=[]; let cur='';
  for(const w of words){ const t=(cur+' '+w).trim(); if(ctx.measureText(t).width>maxW && cur){ lines.push(cur); cur=w; } else cur=t; }
  if(cur) lines.push(cur); return lines;
}
function _alignX(x0, boxW, lineW){
  if(state.textAlign==='left') return x0;
  if(state.textAlign==='right') return x0+boxW-lineW;
  return x0+(boxW-lineW)/2;
}
function drawTextBlock(W, H, baseSize){
  const size=Math.round(baseSize*state.textSize), subSize=Math.round(size*0.52);
  const marginX=Math.round(W*0.07), boxW=W-marginX*2;
  const {lines:hLines, spaceW}=_wrapHeadline(state.headline, boxW, size);
  const sLines=state.subtitle ? _wrapSub(state.subtitle, boxW, subSize) : [];
  const lineH=size*1.16, subLineH=subSize*1.35, gap=state.subtitle?size*0.28:0;
  const totalH=hLines.length*lineH + (sLines.length?gap+sLines.length*subLineH:0);
  let y = state.textPos==='top' ? Math.round(H*0.06)
        : state.textPos==='bottom' ? Math.round(H*0.94-totalH)
        : Math.round((H-totalH)/2);
  y += state.textDY;
  const x0 = marginX + state.textDX;
  // headline
  ctx.font=`700 ${size}px -apple-system, "Segoe UI", Roboto, sans-serif`; ctx.textAlign='left'; ctx.textBaseline='top';
  let yy=y;
  for(const line of hLines){ const lineW=line.reduce((s,[,,ww])=>s+ww,0)+spaceW*(line.length-1); let x=_alignX(x0,boxW,lineW);
    for(const [w,isAcc,ww] of line){ ctx.fillStyle=isAcc?state.accent:'#f4f6f8'; ctx.fillText(w,x,yy); x+=ww+spaceW; } yy+=lineH; }
  // subtitle
  if(sLines.length){ ctx.font=`400 ${subSize}px -apple-system, "Segoe UI", Roboto, sans-serif`; yy+=gap-lineH+lineH;
    yy=y+hLines.length*lineH+gap;
    for(const ln of sLines){ const tw=ctx.measureText(ln).width; ctx.fillStyle='#9aa2ac'; ctx.fillText(ln,_alignX(x0,boxW,tw),yy); yy+=subLineH; } }
  textBox={x:x0, y, w:boxW, h:totalH};
}

function drawHeadline(text, topY, accent, maxW, size, W){
  ctx.font=`700 ${size}px -apple-system, "Segoe UI", Roboto, sans-serif`; ctx.textAlign='left'; ctx.textBaseline='top';
  const spaceW=ctx.measureText(' ').width; const toks=tokens(text); const lines=[]; let cur=[], curW=0;
  for(const [w,isAcc] of toks){ const ww=ctx.measureText(w).width; if(cur.length && curW+spaceW+ww>maxW){ lines.push(cur); cur=[]; curW=0; } cur.push([w,isAcc,ww]); curW+=(cur.length>1?spaceW:0)+ww; }
  if(cur.length) lines.push(cur);
  const lineH=size*1.16; let y=topY;
  for(const line of lines){ const total=line.reduce((s,[,,ww])=>s+ww,0)+spaceW*(line.length-1); let x=(W-total)/2;
    for(const [w,isAcc,ww] of line){ ctx.fillStyle=isAcc?accent:'#f4f6f8'; ctx.fillText(w,x,y); x+=ww+spaceW; } y+=lineH; }
  return y;
}
function drawSubtitle(text, topY, size, maxW, W){
  if(!text) return topY;
  ctx.font=`400 ${size}px -apple-system, "Segoe UI", Roboto, sans-serif`; ctx.textAlign='left'; ctx.textBaseline='top';
  const words=text.split(' '); const lines=[]; let cur='';
  for(const w of words){ const t=(cur+' '+w).trim(); if(ctx.measureText(t).width>maxW && cur){ lines.push(cur); cur=w; } else cur=t; }
  if(cur) lines.push(cur); let y=topY;
  for(const ln of lines){ const tw=ctx.measureText(ln).width; ctx.fillStyle='#9aa2ac'; ctx.fillText(ln,(W-tw)/2,y); y+=size*1.35; }
  return y;
}

// ---------- render ----------
function render(){
  const isFeature = state.template==='feature_graphic';
  const dev = DEVICES[state.device];
  const ov = state.sizeOverride;
  const W = isFeature ? 1024 : (ov ? ov[0] : dev.w);
  const H = isFeature ? 500 : (ov ? ov[1] : dev.h);
  canvas.width = W; canvas.height = H;

  if (isFeature){
    background(W,H,state.accent,state.bg,state.bgImage,H*0.5);
    let top=Math.round(H*0.30);
    if(state.shot){ const s=Math.round(H*0.30); const ix=(W-s)/2, iy=Math.round(H*0.10);
      ctx.save(); roundRect(ix,iy,s,s,s*0.22); ctx.clip(); drawCover(state.shot,ix,iy,s,s); ctx.restore(); top=iy+s+Math.round(H*0.06); }
    const ey=drawHeadline(state.headline, top, state.accent, W*0.86, Math.round(H*0.11), W);
    drawSubtitle(state.subtitle, ey+Math.round(H*0.02), Math.round(H*0.05), W*0.8, W);
    return;
  }

  if (state.template==='hero'){
    background(W,H,state.accent,state.bg,state.bgImage,Math.round(H*0.32));
    const s=Math.round(W*0.36), ix=(W-s)/2, iy=Math.round(H*0.16);
    if(state.shot){ ctx.save(); roundRect(ix,iy,s,s,s*0.22); ctx.clip(); drawCover(state.shot,ix,iy,s,s); ctx.restore(); }
    else { roundRect(ix,iy,s,s,s*0.22); ctx.fillStyle='#12151b'; ctx.fill(); }
    const ey=drawHeadline(state.headline, iy+s+Math.round(H*0.04), state.accent, W*0.82, Math.round(W*0.085), W);
    drawSubtitle(state.subtitle, ey+Math.round(H*0.012), Math.round(W*0.042), W*0.8, W);
    return;
  }

  // duo: two code-drawn devices side by side
  if (state.template==='duo'){
    background(W,H,state.accent,state.bg,state.bgImage,Math.round(H*0.55));
    drawTextBlock(W, H, Math.round(W*0.06));
    const sw = W*0.44, sh = sw*(dev.h/dev.w), gap = W*0.03;
    const total = sw*2 + gap, x0 = (W-total)/2 + state.dragX;
    const topArea = Math.round(H*0.26);
    const y = topArea + (H - topArea - sh)/2 + state.dragY;
    drawPhone(x0, y, sw, sh, dev.notch, state.shot);
    drawPhone(x0+sw+gap, y, sw, sh, dev.notch, state.shot2 || state.shot);
    return;
  }

  // poster / tilted / showcase / frame
  const isFrame = state.template==='frame';
  const isTilt = state.template==='tilted';
  const isShow = state.template==='showcase';

  // Real device-frame image (transparent screen) → composite screenshot in.
  if (state.frameMode==='real' && state.frameImg){
    const fAsp = state.frameImg.width/state.frameImg.height;
    let fw = W*(isFrame?0.9:0.86), fh = fw/fAsp;
    const maxH = isFrame ? H*0.94 : H*0.82;
    if (fh>maxH){ fh=maxH; fw=fh*fAsp; }
    const fx=(W-fw)/2 + state.dragX;
    const fy=(isFrame ? (H-fh)/2 : (H-fh + H*0.02)) + state.dragY;
    background(W,H,state.accent,state.bg,state.bgImage, fy + fh/3);
    if(!isFrame) drawTextBlock(W, H, Math.round(W*0.072));
    if(state.shot && state.frameScreen){
      const [x0,y0,x1,y1]=state.frameScreen;
      const rx=fx+x0*fw, ry=fy+y0*fh, rw=(x1-x0)*fw, rh=(y1-y0)*fh;
      ctx.save(); roundRect(rx,ry,rw,rh, Math.min(rw,rh)*0.06); ctx.clip(); drawCover(state.shot,rx,ry,rw,rh); ctx.restore();
    }
    ctx.drawImage(state.frameImg, fx,fy,fw,fh);
    return;
  }

  const sw = W * (isFrame ? 0.82 : (isShow ? 0.86 : 0.72));
  const sh = sw * (dev.h/dev.w);
  const dx = (W-sw)/2 + state.dragX;
  const dy = (isFrame ? (H-sh)/2 : (H-sh + (isShow?H*0.10:H*0.02))) + state.dragY;
  background(W,H,state.accent,state.bg,state.bgImage, dy + sh/3);
  if(!isFrame) drawTextBlock(W, H, Math.round(W*0.072));
  if(isTilt){
    ctx.save();
    ctx.translate(dx+sw/2, dy+sh/2); ctx.rotate(-7*Math.PI/180); ctx.translate(-(dx+sw/2), -(dy+sh/2));
    drawPhone(dx,dy,sw,sh,dev.notch,state.shot);
    ctx.restore();
  } else {
    drawPhone(dx,dy,sw,sh,dev.notch,state.shot);
  }
}

// ---------- UI wiring ----------
function chip(container, items, current, onPick, labelFn){
  container.innerHTML='';
  for(const it of items){ const el=document.createElement('div'); el.className='chip'+(it===current?' active':'');
    el.textContent=labelFn?labelFn(it):it; el.onclick=()=>onPick(it); container.appendChild(el); }
}
function refreshChips(){
  chip(document.getElementById('templates'), TEMPLATES, state.template, t=>{ state.template=t; refreshChips(); render(); }, t=>t.replace('_',' '));
  document.getElementById('pickShot2').style.display = state.template==='duo' ? 'flex' : 'none';
  chip(document.getElementById('textPos'), ['top','center','bottom'], state.textPos, v=>{ state.textPos=v; refreshChips(); render(); }, v=>t('pos_'+v));
  chip(document.getElementById('textAlign'), ['left','center','right'], state.textAlign, v=>{ state.textAlign=v; refreshChips(); render(); }, v=>t('al_'+v));
  chip(document.getElementById('devices'), Object.keys(DEVICES), state.device, d=>{ state.device=d; refreshChips(); render(); }, d=>DEVICES[d].label);
  chip(document.getElementById('presets'), Object.keys(PRESETS), null, name=>{ const p=PRESETS[name]; state.accent=p.accent; state.bg=p.bg; state.bgImage=null;
    document.getElementById('accent').value=p.accent; document.getElementById('bg').value=p.bg; render(); });
  const modeLabel = state.frameMode==='code' ? 'Drawn' : 'Image';
  chip(document.getElementById('frameModes'), ['Drawn','Image'], modeLabel, label=>{
    state.frameMode = label==='Image' ? 'real' : 'code';
    const show = state.frameMode==='real';
    document.getElementById('pickFrame').style.display = show ? 'flex' : 'none';
    document.getElementById('frameThumbs').style.display = show ? 'grid' : 'none';
    refreshChips(); render();
  });
}
function loadImage(file, cb){ const img=new Image(); img.onload=()=>cb(img); img.src=URL.createObjectURL(file); }
function pick(cb){ const i=document.createElement('input'); i.type='file'; i.accept='image/*'; i.onchange=()=>{ if(i.files[0]) loadImage(i.files[0], cb); }; i.click(); }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1800); }

document.getElementById('headline').oninput=e=>{ state.headline=e.target.value; render(); };
document.getElementById('subtitle').oninput=e=>{ state.subtitle=e.target.value; render(); };
document.getElementById('accent').oninput=e=>{ state.accent=e.target.value; render(); };
document.getElementById('bg').oninput=e=>{ state.bg=e.target.value; state.bgImage=null; render(); };
document.getElementById('pickShot').onclick=()=>pick(img=>{ state.shot=img; render(); });
document.getElementById('pickShot2').onclick=()=>pick(img=>{ state.shot2=img; render(); });

// Output size selector
function populateSizes(){
  const sel=document.getElementById('sizeSel'); const cur=sel.value;
  sel.innerHTML='';
  SIZES.forEach((s,i)=>{ const o=document.createElement('option'); o.value=i;
    o.textContent = i===0 ? t('size_default') : (s[1]==='custom' ? t('size_custom') : s[0]);
    sel.appendChild(o); });
  if(cur) sel.value=cur;
}
(function(){
  const sel=document.getElementById('sizeSel');
  populateSizes();
  const custom=document.getElementById('customSize');
  const applyCustom=()=>{ const w=parseInt(document.getElementById('sizeW').value,10), h=parseInt(document.getElementById('sizeH').value,10);
    state.sizeOverride = (w>0 && h>0) ? [w,h] : null; render(); };
  sel.onchange=()=>{ const v=SIZES[+sel.value][1];
    if(v==='custom'){ custom.style.display='flex'; applyCustom(); }
    else { custom.style.display='none'; state.sizeOverride = v; render(); } };
  document.getElementById('sizeW').oninput=applyCustom;
  document.getElementById('sizeH').oninput=applyCustom;
})();
function useFrame(img){
  const rect=detectFrameScreen(img);
  state.frameMode='real'; state.frameImg=img; state.frameScreen=rect;
  frameHintKey = rect ? 'frame_hint_ok' : 'frame_hint_none';
  document.getElementById('frameHint').textContent = t(frameHintKey);
  render();
}
document.getElementById('pickFrame').onclick=()=>pick(useFrame);

// Real device frames served by the CLI (--frames <dir>).
async function loadFrames(){
  try {
    const res=await fetch('/api/frames'); const j=await res.json();
    const box=document.getElementById('frameThumbs');
    if(!j.images || !j.images.length) return;
    for(const fr of j.images){ const d=document.createElement('div'); d.className='thumb';
      const img=document.createElement('img'); img.src=fr.url; img.style.objectFit='contain'; d.appendChild(img);
      d.title=fr.name;
      d.onclick=()=>{ const full=new Image(); full.onload=()=>useFrame(full); full.src=fr.url; };
      box.appendChild(d); }
  } catch(e){ /* no --frames */ }
}
document.getElementById('pickBg').onclick=()=>pick(img=>{ state.bgImage=img; render(); });
document.getElementById('clearBg').onclick=()=>{ state.bgImage=null; render(); };

document.getElementById('download').onclick=()=>{ const a=document.createElement('a');
  a.download=`${state.template}_${state.device}.png`; a.href=canvas.toDataURL('image/png'); a.click(); };

document.getElementById('save').onclick=async()=>{
  const name=`${state.template}_${state.device}.png`;
  try {
    const res=await fetch('/api/save',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({name, dataUrl:canvas.toDataURL('image/png')})});
    const j=await res.json();
    toast(j.ok? t('saved')+j.path : t('save_fail'));
  } catch(e){ toast(t('save_fail')); }
};

// font size slider
document.getElementById('textSize').oninput=e=>{ state.textSize=parseFloat(e.target.value); render(); };

// drag: text block if the pointer is on it, otherwise the device
function canvasPt(e){ const r=canvas.getBoundingClientRect(); const s=canvas.width/r.width;
  return {x:(e.clientX-r.left)*s, y:(e.clientY-r.top)*s, r, s}; }
function inTextBox(x,y){ return textBox && x>=textBox.x && x<=textBox.x+textBox.w && y>=textBox.y && y<=textBox.y+textBox.h; }
let dragging=false, dragTarget='device', lastX=0, lastY=0;
canvas.addEventListener('pointerdown', e=>{ const p=canvasPt(e); dragging=true;
  dragTarget = inTextBox(p.x,p.y) ? 'text' : 'device'; lastX=e.clientX; lastY=e.clientY; });
window.addEventListener('pointerup', ()=>dragging=false);
window.addEventListener('pointermove', e=>{ if(!dragging) return; const scale=canvas.width/canvas.getBoundingClientRect().width;
  const dx=(e.clientX-lastX)*scale, dy=(e.clientY-lastY)*scale;
  if(dragTarget==='text'){ state.textDX+=dx; state.textDY+=dy; } else { state.dragX+=dx; state.dragY+=dy; }
  lastX=e.clientX; lastY=e.clientY; render(); });

// double-click the text to edit it inline on the canvas
let inlineEl=null;
canvas.addEventListener('dblclick', e=>{ const p=canvasPt(e); if(!inTextBox(p.x,p.y) || inlineEl) return;
  const r=p.r, s=p.s;
  inlineEl=document.createElement('textarea');
  inlineEl.value=state.headline;
  Object.assign(inlineEl.style,{ position:'fixed', zIndex:50,
    left:(r.left+textBox.x/s)+'px', top:(r.top+textBox.y/s)+'px',
    width:(textBox.w/s)+'px', minHeight:Math.max(44,textBox.h/s*0.6)+'px',
    background:'var(--panel)', color:'var(--text)', border:'2px solid var(--accent)',
    borderRadius:'8px', padding:'6px 8px', font:'600 15px -apple-system, sans-serif', resize:'none' });
  document.body.appendChild(inlineEl); inlineEl.focus(); inlineEl.select();
  const sync=()=>{ state.headline=inlineEl.value; document.getElementById('headline').value=inlineEl.value; render(); };
  const close=()=>{ if(inlineEl){ inlineEl.remove(); inlineEl=null; } };
  inlineEl.oninput=sync;
  inlineEl.onblur=close;
  inlineEl.onkeydown=ev=>{ if(ev.key==='Enter'&&!ev.shiftKey){ ev.preventDefault(); close(); } if(ev.key==='Escape'){ close(); } };
});

// raw screenshots served by the CLI (if any)
async function loadRaw(){
  try {
    const res=await fetch('/api/raw'); const j=await res.json();
    const box=document.getElementById('rawThumbs');
    if(!j.images || !j.images.length){ rawHintKey='raw_hint'; document.getElementById('rawHint').textContent=t('raw_hint'); return; }
    for(const im of j.images){ const d=document.createElement('div'); d.className='thumb';
      const img=document.createElement('img'); img.src=im.url; d.appendChild(img);
      d.onclick=()=>{ const full=new Image(); full.onload=()=>{ state.shot=full; render(); }; full.src=im.url; };
      box.appendChild(d); }
  } catch(e){ /* no server / no raw */ }
}

// ---------- theme + i18n (data hoisted to the top of the script) ----------
function applyI18n(){
  document.querySelectorAll('[data-i18n]').forEach(el=>{ el.textContent = t(el.getAttribute('data-i18n')); });
  document.getElementById('frameHint').textContent = t(frameHintKey);
  document.getElementById('rawHint').textContent = rawHintKey ? t(rawHintKey) : '';
  populateSizes();
  if (typeof refreshChips==='function') refreshChips();
  document.querySelectorAll('.lang').forEach(b=> b.classList.toggle('active', b.dataset.lang===lang));
  document.documentElement.lang = lang;
}
document.querySelectorAll('.lang').forEach(b=> b.onclick=()=>{ lang=b.dataset.lang; localStorage.setItem('vgvLang', lang); applyI18n(); });

function applyTheme(mode){
  document.documentElement.dataset.theme = mode;
  document.getElementById('themeToggle').textContent = mode==='light' ? '☀️' : '🌙';
  localStorage.setItem('vgvTheme', mode);
}
document.getElementById('themeToggle').onclick=()=>
  applyTheme(document.documentElement.dataset.theme==='light' ? 'dark' : 'light');
const savedTheme = localStorage.getItem('vgvTheme')
  || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');

applyTheme(savedTheme);
refreshChips(); loadRaw(); loadFrames(); applyI18n(); render();
</script>
</body>
